# ============================================================
# 超星学习助手配置 —— 只用 TikuGo（免费、免 key）正确率有限
# ============================================================

[tiku]
# 题库：GO题
provider = TikuGo

# 自动提交（必须 true，否则学习进度不前进）
submit = true

cover_rate = 0.8

# 判断题词汇（大小写都列上，避免匹配失败）
true_list = 正确,对,√,是,true,True,T,t,y,1
false_list = 错误,错,×,否,false,False,F,f,n,0,不对,不正确

# 查题间隔（秒）
delay = 0

go_authorization =

# go_min_interval：请求 GO 题库的最小间隔，秒
go_min_interval = 1.0

# go_retry_times：请求失败重试次数
go_retry_times = 3

# go_retry_backoff：重试指数退避基数
go_retry_backoff = 1.2